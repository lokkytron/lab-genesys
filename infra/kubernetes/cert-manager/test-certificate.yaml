apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-smallstep-cert
  namespace: default
spec:
  secretName: test-smallstep-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days before expiry
  commonName: testing.lab.loc
  dnsNames:
    - testing.lab.loc
  issuerRef:
    name: smallstep-acme
    kind: ClusterIssuer
