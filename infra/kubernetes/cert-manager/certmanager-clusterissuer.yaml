apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: smallstep-acme
spec:
  acme:
    server: https://192.168.1.222:9000/acme/acme/directory
    email: you@example.com
    privateKeySecretRef:
      name: smallstep-acme-account-key
    caBundle: 
    solvers:
    - http01:
        ingress:
          class: nginx
