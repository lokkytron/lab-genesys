# alertmanager-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: telemetry
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alertmanager@example.org'

    templates:
    - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'discord-notifications'
      routes:
      - match:
          severity: critical
        receiver: 'discord-notifications'
        repeat_interval: 5m

    receivers:
    - name: 'discord-notifications'
      webhook_configs:
      - url: 'http://webhook-transformer.telemetry.svc.cluster.local'
        send_resolved: true

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']

  discord.tmpl: |
    {{ define "discord" }}
    {
      "content": "Alert triggered"
    }
    {{ end }}
