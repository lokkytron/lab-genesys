---
- name: Ensure kubeconfig directory exists on control node
  delegate_to: localhost
  run_once: true
  file:
    path: "/kubeconfig"
    state: directory
    mode: '0750'

- name: Fetch kubeconfig from K8S master to control node
  become: true
  delegate_to: "{{ K8S_MASTER_HOST }}"
  run_once: true
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "/kubeconfig/lab-k8s.yaml"
    flat: yes
    fail_on_missing: yes

- name: Adjust kubeconfig server address to use master IP
  delegate_to: localhost
  run_once: true
  replace:
    path: "/kubeconfig/lab-k8s.yaml"
    regexp: 'server: https://127\.0\.0\.1:6443'
    replace: "server: https://{{ K8S_MASTER_IP }}:6443"

- name: Set kubeconfig file permissions
  delegate_to: localhost
  run_once: true
  file:
    path: "/kubeconfig/lab-k8s.yaml"
    owner: root
    group: root
    mode: '0600'
