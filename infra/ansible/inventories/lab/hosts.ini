[local]
127.0.0.1 ansible_connection=local

[hostsrv]
192.168.1.222 ansible_user=ansible ansible_ssh_private_key_file=/key_exchange/ansible_id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o CertificateFile=/key_exchange/ansible_id_rsa-cert.pub'

[k8snodes]
k8s-master ansible_host=192.168.5.11
k8s-worker1 ansible_host=192.168.5.21
k8s-worker2 ansible_host=192.168.5.22
k8s-worker3 ansible_host=192.168.5.23

[k8snodes:vars]
ansible_user=ansible
ansible_ssh_private_key_file=/key_exchange/ansible_id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o PreferredAuthentications=publickey'

